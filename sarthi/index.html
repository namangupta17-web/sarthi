<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM-AJAY Saathi Voice Counselor</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .orb-container {
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px;
            width: 300px;
            margin-bottom: 20px;
        }
        .ai-breathing-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        .ai-core {
            width: 60px;
            height: 60px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 30px #ffffff, 0 0 60px #00ffff;
            position: absolute;
            animation: pulse-core 3s infinite ease-in-out;
        }
        .breathing-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 255, 0.3);
            animation: breathe 3s infinite ease-in-out;
        }
        .ring-outer { width: 180px; height: 180px; animation-delay: 0s; }
        .ring-mid { width: 130px; height: 130px; animation-delay: 0.5s; }
        .ring-inner { width: 90px; height: 90px; animation-delay: 1s; }

        @keyframes breathe {
            0%, 100% { transform: scale(0.9); opacity: 0.2; }
            50% { transform: scale(1.15); opacity: 0.8; }
        }
        @keyframes pulse-core {
            0%, 100% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
        }
        .status-text {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        /* Hides any rogue Vapi injected UI elements */
        #vapi-support-button, iframe[src*="vapi"] {
            display: none !important;
        }
    </style>
</head>
<body>

    <h1>PM-AJAY SAATHI</h1>

    <div class="orb-container" onclick="toggleVapiCall()">
        <div class="ai-breathing-wrapper">
            <div class="breathing-ring ring-outer"></div>
            <div class="breathing-ring ring-mid"></div>
            <div class="breathing-ring ring-inner"></div>
            <div class="ai-core"></div>
        </div>
    </div>
    
    <p id="status-display" class="status-text">Click Orb to Start Session</p>

    <!-- Corrected Vapi Web SDK Script Loader -->
    <script>
      var vapiInstance = null;
      const assistantId = "203bfa57-0d89-4c85-a267-8b33ba6182d7";
      const apiKey = "YOUR_VAPI_PUBLIC_KEY"; // <-- Replace this with your actual Vapi public key string

      (function (d, t) {
        var g = document.createElement(t),
            s = d.getElementsByTagName(t)[0];
        g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
        g.async = true;
        s.parentNode.insertBefore(g, s);

        g.onload = function () {
          vapiInstance = window.vapiSDK.run({
            apiKey: "924d91a2-d870-4fcd-8183-edbdd4566069",
            assistant: "203bfa57-0d89-4c85-a267-8b33ba6182d7",
            config: {
              position: "none"
            }
          });

          vapiInstance.on("call-start", () => {
              document.getElementById("status-display").innerText = "Listening... Speak to Saathi";
          });

          vapiInstance.on("call-end", () => {
              document.getElementById("status-display").innerText = "Session Ended - Click to Restart";
          });
        };
      })(document, "script");

      function toggleVapiCall() {
          if (!vapiInstance) {
              alert("Vapi SDK is still loading or check your Public API key!");
              return;
          }
          
          try {
              vapiInstance.toggle();
          } catch (err) {
              console.error("Error toggling Vapi call:", err);
          }
      }
    </script>
</body>
</html>
